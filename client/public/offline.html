<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Rovauto is offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f8fa; color: #111827; }
      main { width: min(100%, 460px); border: 1px solid #e5e7eb; border-radius: 20px; background: #fff; padding: 24px; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08); }
      .icon { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: #b7ff00; font-size: 28px; font-weight: 900; }
      h1 { margin: 18px 0 8px; font-size: 24px; line-height: 1.2; }
      p { margin: 0; color: #64748b; font-size: 15px; line-height: 1.7; }
      a { margin-top: 20px; min-height: 44px; display: inline-flex; width: 100%; align-items: center; justify-content: center; border-radius: 12px; background: #111827; color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">R</div>
      <h1>You are offline</h1>
      <p>Rovauto could not reach the network. Check your mobile data or Wi-Fi connection, then try the page again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
