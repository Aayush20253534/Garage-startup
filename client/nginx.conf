server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 55m;
    client_body_timeout 180s;
    send_timeout 180s;

    # Keep browser requests first-party. This preserves cookie/CSRF behavior
    # and avoids exposing the backend container directly to the frontend code.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /index.html =404;
    }

    location = /support.html {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /support.html =404;
    }

    location = /admin.html {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /admin.html =404;
    }

    location = /intern.html {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /intern.html =404;
    }

    location = /garage.html {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /garage.html =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /support-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/support";
        try_files $uri =404;
    }

    location = /admin-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/admin";
        try_files $uri =404;
    }

    location = /intern-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/intern";
        try_files $uri =404;
    }

    location = /garage-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/garage";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vercel Analytics/Speed Insights endpoints do not exist in the local
    # Nginx container. Return a real 404 instead of the SPA HTML fallback,
    # which browsers otherwise try to parse as JavaScript.
    location ^~ /_vercel/ {
        add_header Cache-Control "no-store";
        return 404;
    }

    location = /support {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /support.html =404;
    }

    location ^~ /support/ {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /support.html;
    }

    location = /admin {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /admin.html =404;
    }

    location ^~ /admin/ {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /admin.html;
    }

    location = /intern {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /intern.html =404;
    }

    location ^~ /intern/ {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /intern.html;
    }

    location = /garage {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /garage.html =404;
    }

    location ^~ /garage/ {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /garage.html;
    }

    location / {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
